[package]
name = "shopping"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "shopping"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false

[dependencies]
libc = "0.2.191"
memchr = "2.8.3"

[features]
prof = []

[profile.prof]
inherits = "release"
debug = "line-tables-only"
